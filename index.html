<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Aktive Bürger Irschenberg</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 24px 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 20px;
      color: #555;
      font-size: 14px;
    }
    .btn {
      display: block;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 999px;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-facebook {
      background: #1877f2;
      color: white;
      box-shadow: 0 4px 10px rgba(24,119,242,0.35);
    }
    .btn-instagram {
      background: linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4);
      color: white;
      box-shadow: 0 4px 10px rgba(221,42,123,0.4);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Aktive Bürger Irschenberg</h1>
    <p>Wähle eine Plattform</p>

    <a class="btn btn-instagram" 
       href="https://www.instagram.com/aktivebuergerirschenberg?igsh=bHB1bTgxNngwazk4" 
       target="_blank" rel="noopener">
      Instagram
    </a>

    <a class="btn btn-facebook" 
       href="https://www.facebook.com/profile.php?id=61586304634943" 
       target="_blank" rel="noopener">
      Facebook
    </a>
  </div>
</body>
</html>
